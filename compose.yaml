name: agentyard

services:
  agentyard:
    build: .
    image: agentyard:local
    restart: unless-stopped
    environment:
      AGENTYARD_APP_ID: ${AGENTYARD_APP_ID:?set through envkey}
      AGENTYARD_APP_KEY_B64: ${AGENTYARD_APP_KEY_B64:?set through envkey}
      # Optional logins; empty means that agent is not used.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      # admin panel, local only
      - 127.0.0.1:8080:8080
    volumes:
      - ./agentyard.toml:/etc/agentyard/agentyard.toml:ro
      - work:/work
      # CLI logins and agent sessions survive restarts: ~/.codex, ~/.claude, opencode data.
      - home:/home/node
    cpus: 4
    mem_limit: 6g

volumes:
  work:
  home:
